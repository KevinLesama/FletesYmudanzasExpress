server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index ingreso.html;

    # Rutas sin extension (mismo mapeo que el plugin de Vite en desarrollo).
    location = /            { try_files /ingreso.html =404; }
    location = /ingreso     { try_files /ingreso.html =404; }
    location = /agenda      { try_files /agenda.html =404; }
    location = /solicitudes { try_files /solicitudes.html =404; }
    location = /solicitudes/nueva { try_files /nueva-solicitud.html =404; }
    location = /planificacion     { try_files /planificacion.html =404; }
    location = /flota       { try_files /flota.html =404; }
    location = /pagos       { try_files /pagos.html =404; }
    location = /ajustes     { try_files /ajustes.html =404; }
    location = /chofer      { try_files /chofer.html =404; }
    location = /chofer/config { try_files /chofer-config.html =404; }

    # Proxy hacia el backend FastAPI (nombre del servicio en docker compose).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets generados por Vite.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
